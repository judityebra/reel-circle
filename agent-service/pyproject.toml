[project]
name = "reel-circle-agent"
version = "0.1.0"
description = "Reel Circle recommendation agent: a LangGraph service behind /api/agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.2.2",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langchain>=1.0",
    "langchain-anthropic>=1.7.12",
    "langchain-google-genai>=4.5.2",
    "langchain-openai>=1.8.5",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langsmith>=0.4",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
