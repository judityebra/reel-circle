name: Quality

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Deterministic baseline is 95.1% field accuracy / 69.2% exact match (docs/EVALUATION.md).
      - run: npm run eval:extraction -- --no-model --gate 0.94 --gate-exact 0.65
      - run: npm run test:e2e
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  agent-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Includes parity with the TypeScript pipeline over fixtures/agent-parity.json.
      - run: uv run pytest
      # Agent scorecard: every deterministic scenario must pass (agent-service/README.md, Agent evaluation).
      - run: uv run reel-eval
      - run: docker build -t reel-circle-agent .
      - name: Container answers its health check
        run: |
          docker run -d --name agent -p 8000:8000 reel-circle-agent
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs agent
          exit 1
